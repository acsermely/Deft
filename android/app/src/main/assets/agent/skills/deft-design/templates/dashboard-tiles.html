<!DOCTYPE html>
<!-- Template: dashboard of tiles. Runtime classes and tokens only. Copy as index.html with a main.js (header comment, then import '/_deft/v1/motion.js';) and a manifest.json (example in references/recipes/bridge.md). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <title>Today</title>
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="today-title">
        <h1 id="today-title" class="deft-largeTitle">Today</h1>
        <p class="deft-subhead">Thursday, 20 November</p>
        <div class="deft-alert" data-tone="warning">
          <deft-icon name="alert-triangle" aria-hidden="true"></deft-icon>
          <span class="deft-body">Storage is nearly full</span>
        </div>
        <h2 class="deft-labelMono">Activity</h2>
        <div class="deft-grid" data-deft-enter="rise">
          <div class="deft-tile">
            <span class="deft-labelMono">Steps</span>
            <span class="deft-tile-value">8412</span>
            <svg viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path d="M0 26 L20 20 L40 22 L60 12 L80 16 L100 4" /></svg>
          </div>
          <div class="deft-tile">
            <span class="deft-labelMono">Battery</span>
            <deft-number value="98"></deft-number>
            <span class="deft-footnote">Charging</span>
          </div>
          <div class="deft-tile">
            <span class="deft-labelMono">Next event</span>
            <span class="deft-headline">Dentist, 14:30</span>
            <span class="deft-footnote">In two hours</span>
          </div>
          <div class="deft-tile">
            <span class="deft-labelMono">Unread</span>
            <span class="deft-tile-value">3</span>
            <span class="deft-badge">New</span>
          </div>
        </div>
        <h2 class="deft-labelMono">Notes</h2>
        <div class="deft-group">
          <a class="deft-cell" href="#inbox">
            <span class="deft-cell-body"><span class="deft-body deft-cell-title">Inbox</span><span class="deft-footnote deft-cell-sub">Three new messages</span></span>
            <deft-icon class="deft-chevron" name="chevron-right" aria-hidden="true"></deft-icon>
          </a>
        </div>
      </section>
    </main>
    <nav class="deft-tabbar" aria-label="Sections">
      <a href="#today" aria-current="page"><deft-icon name="gauge" aria-hidden="true"></deft-icon><span>Today</span></a>
      <a href="#activity"><deft-icon name="activity" aria-hidden="true"></deft-icon><span>Activity</span></a>
      <a href="#settings"><deft-icon name="settings" aria-hidden="true"></deft-icon><span>Settings</span></a>
    </nav>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
