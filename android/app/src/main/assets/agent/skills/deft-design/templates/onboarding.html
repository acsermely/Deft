<!DOCTYPE html>
<!-- Template: onboarding. Runtime classes and tokens only. Copy as index.html with a main.js (header comment, then import '/_deft/v1/motion.js';) and a manifest.json (example in references/recipes/bridge.md). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <title>Welcome</title>
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll deft-center">
      <div class="deft-cover">
        <p class="deft-labelMono">Step 1 of 3</p>
        <section class="deft-stack" aria-labelledby="welcome-title" data-deft-enter="rise">
          <span class="deft-tile-icon"><deft-icon name="sparkles" aria-hidden="true"></deft-icon></span>
          <h1 id="welcome-title" class="deft-largeTitle">Welcome</h1>
          <p class="deft-body">Three quick steps set up your launcher. Nothing leaves this phone until you say so.</p>
          <ul class="deft-list">
            <li class="deft-cluster"><deft-icon name="lock" aria-hidden="true"></deft-icon><span class="deft-body">Your data stays on the device</span></li>
            <li class="deft-cluster"><deft-icon name="bell" aria-hidden="true"></deft-icon><span class="deft-body">Notifications are off until you allow them</span></li>
            <li class="deft-cluster"><deft-icon name="sliders-horizontal" aria-hidden="true"></deft-icon><span class="deft-body">Change anything later in Settings</span></li>
          </ul>
        </section>
        <div class="deft-stack">
          <button class="deft-btn deft-btn-lg" data-primary type="button">Get started</button>
          <button class="deft-btn deft-btn-link" type="button">I have set this up before</button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
