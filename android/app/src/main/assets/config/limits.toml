# max_binary_bytes: 2097152 .. 8388608 (2 MiB .. 8 MiB)
max_binary_bytes = 2097152
# max_files: 256 .. 1024
max_files = 256
# max_package_bytes: 10485760 .. 67108864 (10 MiB .. 64 MiB)
max_package_bytes = 26214400
