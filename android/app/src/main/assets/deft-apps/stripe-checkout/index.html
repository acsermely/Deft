<!DOCTYPE html>
<!-- Stripe test checkout (PARITY G14): Stripe.js and its frames run with web.embed. Test mode only. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stripe test checkout</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="checkout-title">
        <h1 id="checkout-title" class="deft-largeTitle">Stripe test checkout</h1>
        <div id="status" class="deft-alert" data-tone="info" role="status">
          <deft-icon name="info" aria-hidden="true"></deft-icon>
          <span id="status-text" class="deft-body">Loading…</span>
        </div>
        <form id="pay" hidden>
          <div class="deft-stack">
            <div id="card" class="card"></div>
            <button id="submit" class="deft-btn deft-btn-lg" data-primary type="submit">Pay (test)</button>
          </div>
        </form>
        <p class="deft-footnote">Test cards: 4242 4242 4242 4242 pays at once, 4000 0027 6000 3184 asks for 3-D Secure. Any future date and any CVC.</p>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
