<!DOCTYPE html>
<!-- Mesh: nearby BLE chat. Go live to relay short messages with no internet. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mesh</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <header class="deft-topbar">
      <h1 class="deft-title2">Mesh</h1>
      <span class="deft-badge" id="badge" data-off>Off air</span>
      <button class="deft-btn deft-btn-soft" id="live" type="button">Live</button>
    </header>
    <main class="deft-scroll">
      <div class="nick-row">
        <input class="deft-input" id="nick" maxlength="24" placeholder="Nickname" aria-label="Nickname" />
      </div>
      <div class="deft-alert nick-err" data-tone="error" id="err" data-deft-text hidden>
        <deft-icon name="circle-alert" aria-hidden="true"></deft-icon>
        <span class="deft-body"></span>
      </div>
      <div class="deft-msgs" id="log"></div>
    </main>
    <div class="deft-toolbar composer">
      <input class="deft-input" id="text" maxlength="80" placeholder="Broadcast a short message" aria-label="Broadcast message" />
      <button class="deft-btn" data-primary id="send" type="button">Send</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
