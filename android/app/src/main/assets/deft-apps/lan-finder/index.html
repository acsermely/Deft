<!DOCTYPE html>
<!-- LAN Finder: lists web servers on your Wi-Fi and fetches the home page of the one you tap. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LAN Finder</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="finder-title">
        <h1 id="finder-title" class="deft-largeTitle">LAN Finder</h1>
        <div class="deft-cluster">
          <button id="find" class="deft-btn" data-primary type="button">Find devices</button>
          <button id="stop" class="deft-btn" type="button">Stop</button>
        </div>
        <p id="status" class="deft-subhead">Looks for web servers (_http._tcp) on your Wi-Fi.</p>
        <div id="found" class="deft-group"></div>
        <p id="body" class="deft-footnote"></p>
        <p id="log" class="deft-footnote" role="status"></p>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
