<!DOCTYPE html>
<!-- Files: browse the folder the user picked; open, share, rename, copy or delete a file. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Files</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="title">
        <h1 id="title" class="deft-largeTitle">Files</h1>
        <div class="deft-cluster">
          <button class="deft-btn deft-btn-soft" id="up" type="button" hidden><deft-icon name="arrow-left" aria-hidden="true"></deft-icon>Up</button>
          <button class="deft-btn deft-btn-soft" id="photo" type="button"><deft-icon name="image" aria-hidden="true"></deft-icon>Photo</button>
        </div>
        <p class="deft-footnote deft-mono" id="crumb"></p>
        <div class="deft-alert" id="err" data-tone="error" role="alert" hidden>
          <deft-icon name="circle-alert" aria-hidden="true"></deft-icon>
          <span class="deft-body">Something went wrong.</span>
        </div>
        <div class="deft-group" id="list"></div>
        <div id="empty"></div>
      </section>
    </main>
    <button class="deft-fab" data-float id="folder" data-primary type="button" aria-label="Pick folder"><deft-icon name="folder" aria-hidden="true"></deft-icon></button>
  </div>
  <dialog class="deft-sheet" id="sheet" data-detents="medium large" aria-labelledby="sheetName">
    <div class="deft-stack">
      <h2 class="deft-title3" id="sheetName">File</h2>
      <button class="deft-btn" data-primary id="open" type="button"><deft-icon name="external-link" aria-hidden="true"></deft-icon>Open</button>
      <button class="deft-btn" id="share" type="button"><deft-icon name="share-2" aria-hidden="true"></deft-icon>Share</button>
      <button class="deft-btn" id="rename" type="button"><deft-icon name="pencil" aria-hidden="true"></deft-icon>Rename</button>
      <button class="deft-btn" id="copy" type="button"><deft-icon name="copy" aria-hidden="true"></deft-icon>Copy</button>
      <button class="deft-btn" data-tone="destructive" id="del" type="button"><deft-icon name="trash-2" aria-hidden="true"></deft-icon>Delete</button>
      <button class="deft-btn deft-btn-ghost" id="close" type="button">Close</button>
    </div>
  </dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
