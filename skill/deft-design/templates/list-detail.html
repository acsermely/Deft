<!DOCTYPE html>
<!-- Template: list to detail. Runtime classes and tokens only. Copy as index.html with a main.js (header comment, then import '/_deft/v1/motion.js';) and a manifest.json (example in references/recipes/bridge.md). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Notes</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <div class="deft-sidebar">
        <section class="deft-page" data-large-title aria-labelledby="list-title">
          <h1 id="list-title" class="deft-largeTitle">Notes</h1>
          <input class="deft-input" type="search" placeholder="Search notes" aria-label="Search notes" />
          <div class="deft-group" data-deft-enter="rise">
            <a class="deft-cell" href="#note-1" aria-current="page">
              <span class="deft-cell-body"><span class="deft-body deft-cell-title">Trip plan</span><span class="deft-footnote deft-cell-sub">Lisbon, three days</span></span>
              <span class="deft-subhead deft-cell-value">Today</span>
              <deft-icon class="deft-chevron" name="chevron-right" aria-hidden="true"></deft-icon>
            </a>
            <a class="deft-cell" href="#note-2">
              <span class="deft-cell-body"><span class="deft-body deft-cell-title">Groceries</span><span class="deft-footnote deft-cell-sub">Milk, eggs, coffee</span></span>
              <span class="deft-subhead deft-cell-value">Mon</span>
              <deft-icon class="deft-chevron" name="chevron-right" aria-hidden="true"></deft-icon>
            </a>
            <a class="deft-cell" href="#note-3">
              <span class="deft-cell-body"><span class="deft-body deft-cell-title">Reading list</span><span class="deft-footnote deft-cell-sub">Three books</span></span>
              <span class="deft-subhead deft-cell-value">Nov 3</span>
              <deft-icon class="deft-chevron" name="chevron-right" aria-hidden="true"></deft-icon>
            </a>
          </div>
        </section>
        <article class="deft-card" aria-labelledby="detail-title">
          <h2 id="detail-title" class="deft-title2">Trip plan</h2>
          <p class="deft-subhead">Lisbon, three days. Edited today.</p>
          <p class="deft-body">Day one: Alfama and the tram. Day two: Sintra. Day three: the coast at Cascais.</p>
          <div class="deft-card-actions">
            <button class="deft-btn" data-primary type="button">Share</button>
            <button class="deft-btn deft-btn-ghost" type="button">Move</button>
          </div>
        </article>
      </div>
    </main>
    <nav class="deft-tabbar" aria-label="Sections">
      <a href="#notes" aria-current="page"><deft-icon name="list" aria-hidden="true"></deft-icon><span>Notes</span></a>
      <a href="#search"><deft-icon name="search" aria-hidden="true"></deft-icon><span>Search</span></a>
      <a href="#settings"><deft-icon name="settings" aria-hidden="true"></deft-icon><span>Settings</span></a>
    </nav>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
