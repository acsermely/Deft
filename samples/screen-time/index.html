<!DOCTYPE html>
<!-- screen-time: Deft app page. Runtime classes and tokens only. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Screen Time</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="st-title">
        <h1 id="st-title" class="deft-largeTitle">Screen Time</h1>
        <div class="deft-cluster">
          <button id="apps" class="deft-btn" type="button">Apps</button>
          <button id="usage" class="deft-btn" data-primary type="button">Used today</button>
          <button id="device" class="deft-btn" type="button">Device id</button>
        </div>
        <p id="status" class="deft-subhead" role="status">Tap a button to start</p>
        <div id="rows" class="deft-group"></div>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
