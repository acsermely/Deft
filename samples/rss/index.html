<!DOCTYPE html>
<!-- RSS Reader: type a feed address; items and pictures load with network.open. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RSS Reader</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="title">
        <h1 id="title" class="deft-largeTitle">RSS Reader</h1>
        <div class="bar">
          <input id="url" class="deft-input" type="url" aria-label="Feed address" inputmode="url" placeholder="Feed address, e.g. https://example.com/feed.xml" autocomplete="off" />
          <button id="load" class="deft-btn" data-primary type="button">Read</button>
        </div>
        <div id="status" class="deft-alert" data-tone="info" role="status">
          <deft-icon name="info" aria-hidden="true"></deft-icon>
          <span class="deft-body">Type the address of an RSS or Atom feed.</span>
        </div>
        <div id="items"></div>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
