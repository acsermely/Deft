<!DOCTYPE html>
<!-- wifi-analyzer: Deft app page. Runtime classes and tokens only. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wi-Fi Analyzer</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="wifi-title">
        <h1 id="wifi-title" class="deft-largeTitle">Wi-Fi Analyzer</h1>
        <div class="deft-cluster">
          <button id="scan" class="deft-btn" data-primary type="button">Scan</button>
          <button id="info" class="deft-btn" type="button">Current network</button>
          <button id="panel" class="deft-btn" type="button">Wi-Fi settings</button>
        </div>
        <p id="status" class="deft-subhead" role="status"></p>
        <h2 class="deft-labelMono">Networks</h2>
        <div id="networks" class="deft-group"></div>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
