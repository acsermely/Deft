<!DOCTYPE html>
<!-- Clock: one-shot reminders scheduled through the launcher alarms bridge. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clock</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="title">
        <h1 id="title" class="deft-largeTitle">Clock</h1>
        <p class="deft-footnote">One-shot reminders. They fire even if this app is closed.</p>
        <div class="deft-alert" id="err" data-tone="error" role="alert" hidden>
          <deft-icon name="circle-alert" aria-hidden="true"></deft-icon>
          <span class="deft-body">Something went wrong.</span>
        </div>
        <div class="deft-group" id="list"></div>
        <div id="empty"></div>
      </section>
    </main>
    <button class="deft-fab" data-float id="add" data-primary type="button" aria-label="Add reminder"><deft-icon name="plus" aria-hidden="true"></deft-icon></button>
  </div>
  <dialog class="deft-sheet" id="sheet" data-detents="large" aria-labelledby="sheetTitle">
    <form id="form" class="deft-stack">
      <h2 id="sheetTitle" class="deft-title3">New reminder</h2>
      <div class="deft-stack">
        <label class="deft-subhead" for="fWhen">When</label>
        <input id="fWhen" class="deft-input" type="datetime-local" required />
      </div>
      <div class="deft-stack">
        <label class="deft-subhead" for="fTitle">Title</label>
        <input id="fTitle" class="deft-input" required placeholder="Reminder" />
      </div>
      <div class="deft-stack">
        <label class="deft-subhead" for="fBody">Note</label>
        <textarea id="fBody" class="deft-textarea" rows="2">Time to check in</textarea>
      </div>
      <div class="deft-card-actions">
        <button class="deft-btn deft-btn-ghost" type="button" id="cancel">Cancel</button>
        <button class="deft-btn" data-primary type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
