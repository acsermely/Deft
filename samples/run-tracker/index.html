<!DOCTYPE html>
<!-- Run Tracker: distance, a route drawing, and Start, Stop and Clear. Records with the screen off. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Run Tracker</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="title">
        <h1 id="title" class="deft-largeTitle">Run Tracker</h1>
        <div class="run">
          <div class="deft-cluster distance">
            <deft-number id="distance" value="0.00"></deft-number>
            <span class="deft-title3">km</span>
          </div>
          <p id="status" class="deft-subhead">Not recording</p>
          <svg id="map" class="map" viewBox="0 0 300 300" role="img" aria-label="Your route">
            <polyline id="track" class="track" points="" />
            <circle id="here" class="here" cx="-10" cy="-10" r="5" />
          </svg>
          <div class="deft-cluster controls">
            <button id="start" class="deft-btn" data-primary type="button">Start</button>
            <button id="stop" class="deft-btn" type="button" disabled>Stop</button>
            <button id="clear" class="deft-btn deft-btn-ghost" type="button">Clear</button>
          </div>
          <p class="deft-footnote hint">Press Start, then lock the phone or leave the app. Recording goes on with a notification until you press Stop.</p>
        </div>
        <pre id="log" class="deft-mono" data-wrap></pre>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
