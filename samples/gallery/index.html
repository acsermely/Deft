<!DOCTYPE html>
<!-- Gallery: a grid of the photos on this phone; a picture opened from another app shows first. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gallery</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="gallery-title">
        <h1 id="gallery-title" class="deft-largeTitle">Gallery</h1>
        <div class="deft-cluster">
          <button id="load" class="deft-btn" data-primary type="button">Load photos</button>
        </div>
        <div id="grid" class="deft-media-grid"></div>
        <p id="log" class="deft-footnote" role="status"></p>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
