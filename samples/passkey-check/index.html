<!DOCTYPE html>
<!-- Passkey Check: tests the passkeys bridge against app.acsermely.hu, which lists this app. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Passkey Check</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="pk-title">
        <h1 id="pk-title" class="deft-largeTitle">Passkey Check</h1>
        <p class="deft-footnote">Creates a passkey for app.acsermely.hu, signs in with it, and checks the answer here the way a website's server would.</p>
        <h2 class="deft-labelMono">This app</h2>
        <p id="about" class="deft-footnote"></p>
        <div class="deft-stack">
          <div class="deft-cluster">
            <button id="create" class="deft-btn" data-primary type="button">1. Create passkey</button>
            <button id="signin" class="deft-btn" type="button">2. Sign in</button>
          </div>
          <div class="deft-cluster">
            <button id="unlisted" class="deft-btn" type="button">3. Website that did not allow this app</button>
            <button id="undeclared" class="deft-btn" type="button">4. Website not in the manifest</button>
          </div>
          <button id="forget" class="deft-btn" type="button">Forget the saved passkey here</button>
        </div>
        <p id="log" class="deft-footnote" role="status"></p>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
