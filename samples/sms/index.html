<!DOCTYPE html>
<!-- Messages: conversation list, one thread and a compose sheet. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Messages</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app" id="inbox">
    <main class="deft-scroll">
      <section class="deft-page inbox-page" data-large-title>
        <h1 class="deft-largeTitle">Messages</h1>
        <input class="deft-input" id="q" type="search" placeholder="Search" aria-label="Search conversations" />
        <div class="deft-alert" data-tone="error" id="err" data-deft-text hidden>
          <deft-icon name="circle-alert" aria-hidden="true"></deft-icon>
          <span class="deft-body"></span>
        </div>
        <div id="threads"></div>
      </section>
    </main>
    <button class="deft-fab" data-primary data-float id="compose" type="button" aria-label="New message"><deft-icon name="pencil" aria-hidden="true"></deft-icon></button>
  </div>
  <div class="deft-app" id="chat" hidden>
    <header class="deft-topbar">
      <button class="deft-btn deft-btn-ghost" id="back" type="button"><deft-icon name="chevron-left" aria-hidden="true"></deft-icon>Back</button>
      <h1 class="deft-headline" id="chatTitle">Chat</h1>
    </header>
    <div class="deft-msgs" id="msgs"></div>
    <div class="deft-alert chat-err" data-tone="error" id="chatErr" data-deft-text hidden>
      <deft-icon name="circle-alert" aria-hidden="true"></deft-icon>
      <span class="deft-body"></span>
    </div>
    <div class="deft-toolbar composer">
      <button class="deft-btn deft-btn-soft" id="attach" type="button" aria-label="Attach photo"><deft-icon name="image" aria-hidden="true"></deft-icon></button>
      <textarea class="deft-textarea" id="body" rows="1" aria-label="Message" placeholder="Message"></textarea>
      <button class="deft-btn" data-primary id="send" type="button">Send</button>
    </div>
  </div>
  <dialog class="deft-sheet" id="sheet" data-detents="large" aria-labelledby="newTitle">
    <form id="newForm" class="deft-stack">
      <h2 class="deft-title3" id="newTitle">New message</h2>
      <label class="deft-subhead" for="to">To</label>
      <input class="deft-input" id="to" type="tel" required placeholder="+15551234567" />
      <label class="deft-subhead" for="newBody">Message</label>
      <textarea class="deft-textarea" id="newBody" rows="3"></textarea>
      <div class="deft-card-actions">
        <button class="deft-btn deft-btn-ghost" type="button" id="cancel">Cancel</button>
        <button class="deft-btn" data-primary type="submit">Send</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
