<!DOCTYPE html>
<!-- pedometer: Deft app page. Runtime classes and tokens only. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pedometer</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page" data-large-title aria-labelledby="pd-title">
        <h1 id="pd-title" class="deft-largeTitle">Pedometer</h1>
        <div class="deft-cluster">
          <button id="steps" class="deft-btn" data-primary type="button">Start steps</button>
          <button id="light" class="deft-btn" type="button">Start light</button>
          <button id="stop" class="deft-btn deft-btn-ghost" type="button">Stop all</button>
        </div>
        <h2 class="deft-labelMono">Now</h2>
        <div class="deft-grid" data-deft-enter="rise">
          <div class="deft-tile">
            <span class="deft-labelMono">Steps since start</span>
            <deft-number id="stepCount" class="deft-tile-value" value="-"></deft-number>
          </div>
          <div class="deft-tile">
            <span class="deft-labelMono">Light level</span>
            <deft-number id="lux" class="deft-tile-value" value="-"></deft-number>
            <span class="deft-footnote">lux</span>
          </div>
        </div>
        <h2 class="deft-labelMono">Log</h2>
        <div id="log" class="deft-footnote" role="log"></div>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
