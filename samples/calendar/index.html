<!DOCTYPE html>
<!-- Calendar: month grid, day agenda and an event sheet. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Calendar</title>
  <link rel="stylesheet" href="/_deft/v1/base.css" />
  <link rel="stylesheet" href="/_deft/v1/tokens.css" />
  <link rel="stylesheet" href="/_deft/v1/components.css" />
  <link rel="stylesheet" href="/_deft/v1/theme.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="deft-app">
    <main class="deft-scroll">
      <section class="deft-page cal-page" data-large-title>
        <h1 class="deft-largeTitle" id="monthTitle">Calendar</h1>
        <div class="deft-cluster">
          <button class="deft-btn deft-btn-soft" id="prev" type="button" aria-label="Previous month"><deft-icon name="chevron-left" aria-hidden="true"></deft-icon></button>
          <button class="deft-btn deft-btn-soft" id="next" type="button" aria-label="Next month"><deft-icon name="chevron-right" aria-hidden="true"></deft-icon></button>
        </div>
        <div class="deft-alert" data-tone="error" id="err" data-deft-text hidden>
          <deft-icon name="circle-alert" aria-hidden="true"></deft-icon>
          <span class="deft-body" id="errText"></span>
        </div>
        <div class="deft-cal-grid" id="grid"></div>
        <h2 class="deft-labelMono" id="dayLabel">Today</h2>
        <div id="agenda"></div>
      </section>
    </main>
    <button class="deft-fab" data-primary data-float id="add" type="button" aria-label="Add event"><deft-icon name="plus" aria-hidden="true"></deft-icon></button>
  </div>
  <dialog class="deft-sheet" id="sheet" data-detents="large" aria-labelledby="formTitle">
    <form id="form" class="deft-stack">
      <h2 class="deft-title3" id="formTitle">New event</h2>
      <label class="deft-subhead" for="fTitle">Title</label>
      <input class="deft-input" id="fTitle" required />
      <label class="deft-subhead" for="fStart">Starts</label>
      <input class="deft-input" id="fStart" type="datetime-local" required />
      <label class="deft-subhead" for="fEnd">Ends</label>
      <input class="deft-input" id="fEnd" type="datetime-local" required />
      <label class="deft-subhead" for="fDesc">Notes</label>
      <textarea class="deft-textarea" id="fDesc" rows="2"></textarea>
      <div class="deft-card-actions">
        <button class="deft-btn deft-btn-ghost" type="button" id="cancel">Cancel</button>
        <button class="deft-btn" data-primary type="submit">Save</button>
      </div>
      <div class="deft-card-actions" id="deleteRow" hidden>
        <button class="deft-btn" data-tone="destructive" type="button" id="del"><deft-icon name="trash-2" aria-hidden="true"></deft-icon>Delete</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
